# Trainer image for Docker and Proxmox users (amd64 + arm64) on ghcr.io.
# The Home Assistant app builds its own image from sprachmodell_trainer/.
name: Trainer image

on:
  push:
    branches: [main]
    paths:
      - sprachmodell_trainer/**
  pull_request:
    paths:
      - sprachmodell_trainer/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  bild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          echo "version=$(grep -E '^version:' sprachmodell_trainer/config.yaml | tr -d '\" ' | cut -d: -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names in lower case
        id: n
        run: |
          echo "bild=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wake-word-studio-trainer" >> "$GITHUB_OUTPUT"
      # Every image first runs a complete tiny training (features, training with evaluation, model conversion,
      # test) - only if that works, it is published
      - name: Build image for the self-test
        uses: docker/build-push-action@v6
        with:
          context: sprachmodell_trainer
          platforms: linux/amd64
          load: true
          tags: trainer-selbsttest
          cache-from: type=gha
      - name: Self-test (complete tiny training run)
        run: docker run --rm trainer-selbsttest python -m trainer.selbsttest
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: sprachmodell_trainer
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Wake Word Studio Trainer: your own wake words for ESPHome voice devices (microWakeWord)
          tags: |
            ${{ steps.n.outputs.bild }}:latest
            ${{ steps.n.outputs.bild }}:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Graphics card version (NVIDIA, amd64 only). The runners have no card: the self-test proves that the image works
  # and falls back to the processor; training on a real card is reported by users.
  bild-gpu:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (CUDA libraries are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          echo "version=$(grep -E '^version:' sprachmodell_trainer/config.yaml | tr -d '\" ' | cut -d: -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names in lower case
        id: n
        run: |
          echo "bild=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wake-word-studio-trainer" >> "$GITHUB_OUTPUT"
      - name: Build GPU image for the self-test
        uses: docker/build-push-action@v6
        with:
          context: sprachmodell_trainer
          platforms: linux/amd64
          build-args: BILD=gpu
          load: true
          tags: trainer-selbsttest-gpu
          cache-from: type=gha,scope=gpu
      - name: Self-test without a card (must fall back to the processor)
        run: docker run --rm trainer-selbsttest-gpu python -m trainer.selbsttest
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: sprachmodell_trainer
          platforms: linux/amd64
          build-args: BILD=gpu
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Wake Word Studio Trainer (NVIDIA graphics card version)
          tags: |
            ${{ steps.n.outputs.bild }}:gpu
            ${{ steps.n.outputs.bild }}:${{ steps.v.outputs.version }}-gpu
          cache-from: type=gha,scope=gpu
          cache-to: type=gha,scope=gpu,mode=max
